apply plugin: "com.android.application"
apply plugin: "com.facebook.react"
apply plugin: "org.jetbrains.kotlin.android"

react {
    autolinkLibrariesWithApp()
}

android {
    ndkVersion "26.1.10909125"
    buildToolsVersion "34.0.0"
    compileSdk 34
    namespace "com.jrtunes"

    defaultConfig {
        applicationId "com.jrtunes"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        // GitHub Actions builds an UNSIGNED release APK by default (debug-signed).
        // To ship to real devices/Play Store, add your own keystore + secrets
        // and point release signingConfig at it — see README.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}